<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Stone Gate Zendo — Enso</title>
  <!-- Enso: Zen brush circle — intentionally imperfect, not quite closed -->
  <circle
    cx="32"
    cy="32"
    r="22"
    fill="none"
    stroke="#5C5C5C"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-dasharray="126 12"
    stroke-dashoffset="0"
    transform="rotate(-100 32 32)"
  />
  <!-- Inner small circle — the open center -->
  <circle cx="32" cy="32" r="3.5" fill="#2A2A2A" opacity="0.35" />
</svg>
